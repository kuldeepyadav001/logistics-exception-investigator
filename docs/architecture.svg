<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#020617"/>
  <text x="40" y="42" fill="#e2e8f0" font-size="22" font-weight="700">Logistics Exception Investigator — AWS architecture</text>
  <text x="40" y="66" fill="#64748b" font-size="13">Every AWS service has a real job in the pipeline. Local adapters (same interfaces) run the identical code in dev/test.</text>

  <!-- UI -->
  <rect x="360" y="88" width="260" height="58" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="490" y="113" fill="#e0f2fe" font-size="15" font-weight="600" text-anchor="middle">React Web UI</text>
  <text x="490" y="132" fill="#64748b" font-size="11.5" text-anchor="middle">4 screens · hosted on AWS Amplify</text>

  <!-- API Gateway -->
  <rect x="360" y="186" width="260" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="490" y="208" fill="#e0f2fe" font-size="15" font-weight="600" text-anchor="middle">Amazon API Gateway</text>
  <text x="490" y="226" fill="#64748b" font-size="11.5" text-anchor="middle">8 contract endpoints · HTTP API</text>

  <!-- Lambda API -->
  <rect x="360" y="278" width="260" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="490" y="300" fill="#e0f2fe" font-size="15" font-weight="600" text-anchor="middle">AWS Lambda — API</text>
  <text x="490" y="318" fill="#64748b" font-size="11.5" text-anchor="middle">FastAPI handlers · Pydantic contracts · correlation IDs</text>

  <!-- S3 -->
  <rect x="40" y="278" width="220" height="52" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="150" y="300" fill="#d1fae5" font-size="14" font-weight="600" text-anchor="middle">Amazon S3</text>
  <text x="150" y="318" fill="#64748b" font-size="11.5" text-anchor="middle">source documents (PO/BOL/POD/INV)</text>

  <!-- DynamoDB -->
  <rect x="720" y="278" width="220" height="52" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="830" y="300" fill="#d1fae5" font-size="14" font-weight="600" text-anchor="middle">Amazon DynamoDB</text>
  <text x="830" y="318" fill="#64748b" font-size="11.5" text-anchor="middle">7 tables: shipments … audit events</text>

  <!-- Pipeline Lambda -->
  <rect x="360" y="392" width="260" height="52" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="490" y="414" fill="#ede9fe" font-size="15" font-weight="600" text-anchor="middle">Lambda — pipeline</text>
  <text x="490" y="432" fill="#64748b" font-size="11.5" text-anchor="middle">ingest → normalize → reconcile → investigate</text>

  <!-- Textract -->
  <rect x="60" y="392" width="220" height="52" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="170" y="414" fill="#fef3c7" font-size="14" font-weight="600" text-anchor="middle">Amazon Textract</text>
  <text x="170" y="432" fill="#64748b" font-size="11.5" text-anchor="middle">invoice / document field extraction</text>

  <!-- Bedrock -->
  <rect x="700" y="392" width="240" height="52" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="820" y="414" fill="#fef3c7" font-size="14" font-weight="600" text-anchor="middle">Amazon Bedrock (Claude)</text>
  <text x="820" y="432" fill="#64748b" font-size="11.5" text-anchor="middle">evidence-grounded investigation · schema-validated</text>

  <!-- CloudWatch -->
  <rect x="360" y="486" width="260" height="46" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="490" y="506" fill="#cbd5e1" font-size="13.5" font-weight="600" text-anchor="middle">CloudWatch Logs</text>
  <text x="490" y="522" fill="#64748b" font-size="11" text-anchor="middle">every Lambda run · observability for the demo</text>

  <!-- local note -->
  <rect x="40" y="540" width="900" height="44" rx="10" fill="#022c22" stroke="#065f46" stroke-width="1"/>
  <text x="60" y="559" fill="#6ee7b7" font-size="12" font-weight="600">Local adapters (same interfaces, dev/test/today):</text>
  <text x="60" y="576" fill="#64748b" font-size="12">filesystem = S3 · SQLite = DynamoDB · controlled PDF parser = Textract · rule-table investigation = Bedrock</text>

  <!-- arrows -->
  <line x1="490" y1="146" x2="490" y2="182" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="238" x2="490" y2="274" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="330" x2="490" y2="388" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="444" x2="490" y2="482" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="360" y1="304" x2="264" y2="304" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <line x1="620" y1="304" x2="716" y2="304" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <line x1="360" y1="418" x2="284" y2="418" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="620" y1="418" x2="696" y2="418" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="340" x2="720" y2="392" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
</svg>
